# Configuração lida pela Análise Automática do SonarCloud
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,.git/**,.github/**,**/.*/**,**/tool/**,**/backups/**,dashboard/.next/**,**/*.html
sonar.tests=oto-db/tests,android-app-olimpia/test,dashboard/test
sonar.test.inclusions=**/tests/**,**/test/**

# Seeds gerados por script (SQL repetitivo por natureza) não entram na checagem de duplicação
sonar.cpd.exclusions=oto-db/db/seeds/**
