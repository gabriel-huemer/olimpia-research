name: oto_pesquisador
description: "OTO – App do Pesquisador: coleta offline da Pesquisa de Demanda Turística de Olímpia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.2+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/seed/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
