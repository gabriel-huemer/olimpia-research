name: CI

on:
  push:
    branches: [main]
    paths:
      - 'oto-db/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'oto-db/**'
      - '.github/workflows/ci.yml'

jobs:
  banco:
    name: Banco de dados (migrações e testes)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oto
          POSTGRES_USER: oto_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oto_admin -d oto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: oto_admin
      PGDATABASE: oto
      OTO_APP_ADMIN_EMAIL: admin@oto.test
    defaults:
      run:
        working-directory: oto-db
    steps:
      - uses: actions/checkout@v4

      - name: Gerar credenciais efêmeras para o ambiente de CI
        run: |
          {
            echo "OTO_WEB_PASSWORD=$(openssl rand -hex 12)"
            echo "OTO_MOBILE_PASSWORD=$(openssl rand -hex 12)"
            echo "OTO_READONLY_PASSWORD=$(openssl rand -hex 12)"
            echo "OTO_APP_ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } >> "$GITHUB_ENV"

      - name: Criar o banco do zero
        run: bash scripts/bootstrap.sh

      - name: Rodar de novo (tem que ser idempotente)
        run: bash scripts/bootstrap.sh

      - name: Testes de estrutura e permissões
        run: psql -X -q -o /dev/null -v ON_ERROR_STOP=1 -f tests/smoke_test.sql
