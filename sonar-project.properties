sonar.projectKey=olimpia-research
sonar.projectName=Olimpia Research
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,.git/**,.github/**,**/.*/**,**/tool/**,**/backups/**,dashboard/.next/**

# Dart/Flutter configuration
sonar.inclusions=**/*.dart,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.sql,**/*.py

# Language-specific exclusions
sonar.dart.coverage.reportPath=coverage/lcov.info
sonar.typescript.lcov.reportPaths=dashboard/coverage/lcov.info
sonar.python.coverage.reportPath=coverage.xml

# Code smells and issues thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
